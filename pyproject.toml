[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wow-forever-armory-bot"
version = "0.1.0"
description = "Public WoW Forever Armory data layer"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{name = "WoW Forever Armory contributors"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
packages = ["wow_forever_armory"]
strict = true
