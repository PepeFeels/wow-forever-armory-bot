[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wow-forever-armory-bot"
version = "1.1.1"
description = "WoW Forever Armory Core and Discord integration"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [{name = "WoW Forever Armory contributors"}]
dependencies = ["discord.py==2.7.1", "Pillow==13.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wow_forever_armory = [
    "assets/*.png",
    "assets/class_icons/*.png",
    "assets/fonts/*.ttf",
    "assets/fonts/*.txt",
]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
packages = ["wow_forever_armory"]
strict = true
